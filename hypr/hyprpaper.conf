ipc = on

# monitor vacío = vale para todas las pantallas. Si se nombra una en concreto
# (por ejemplo eDP-1), el script que rota el fondo ya no puede cambiarla:
# usa "hyprctl hyprpaper wallpaper ,<imagen>", que solo afecta a las pantallas
# sin asignación propia.
wallpaper {
    monitor =
    path = /home/al3xmm14/.secrets/wallpapers/arch-linux-hd-1920x1080.jpg
    fit_mode = cover
}
