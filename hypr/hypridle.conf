# ~/.config/hypr/hypridle.conf
#
# Bloqueo por inactividad y apagado de la pantalla.
# Se arranca desde hyprland.lua. Requiere el paquete hypridle.
#
# Nota: aquí NO se usa `hyprctl dispatch dpms on/off` como en los ejemplos
# habituales. Con la configuración en Lua ese comando da error de sintaxis, y
# el equivalente `hl.dsp.dpms(...)` ignora el argumento y solo alterna. Por eso
# se llama a scripts/dpms.sh, que comprueba el estado antes de tocar nada.

general {
    # Lo que se ejecuta cuando algo pide bloquear la sesión.
    # `pidof` evita abrir dos hyprlock si ya hay uno.
    lock_cmd = pidof hyprlock || hyprlock

    # Al suspender, bloquear antes de dormir; al volver, encender la pantalla
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/dpms.sh on
}

# 5 minutos sin actividad: apagar la pantalla.
# Al volver a haber actividad se enciende sola (además de misc.mouse_move_enables_dpms
# y misc.key_press_enables_dpms, que están activados en hyprland.lua).
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume = ~/.config/hypr/scripts/dpms.sh on
}

# 10 minutos sin actividad: bloquear la sesión.
# La pantalla ya lleva 5 minutos apagada; al despertarla aparece hyprlock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
